services:
  postgres:
    image: postgres:16-alpine
    container_name: neuroscan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuroscanai
      POSTGRES_PASSWORD: neuroscan_dev_pass
      POSTGRES_DB: neuroscanai
    ports:
      - "5432:5432"
    volumes:
      - neuroscanai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroscanai -d neuroscanai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  neuroscanai_pgdata:
